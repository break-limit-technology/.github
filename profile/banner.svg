<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c2ff00" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c2ff00" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="title"><text x="600" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" letter-spacing="14">BREAK LIMIT</text></clipPath>
    <clipPath id="frame"><rect width="1200" height="320"/></clipPath>
  </defs>
  <style>
    .title{fill:#c2ff00;animation:glow 3s ease-in-out infinite}
    .sub{opacity:0;animation:rise 1s .5s ease-out forwards}
    .tag{opacity:0;animation:rise 1s 1s ease-out forwards}
    .tag2{animation:pulse 3s 2s ease-in-out infinite}
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #c2ff00)}50%{filter:drop-shadow(0 0 14px #c2ff00)}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#10110f"/>
    <g opacity=".5">
      <circle cx="150" cy="60" r="2" fill="#c2ff00"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="90" r="2" fill="#c2ff00"><animate attributeName="cy" values="90;65;90" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="270" r="1.6" fill="#c2ff00"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="40" r="1.6" fill="#c2ff00"><animate attributeName="opacity" values="1;0;1" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="9s" repeatCount="indefinite"/>
      <path d="M0 250 C150 215 300 285 450 250 S750 215 900 250 S1200 285 1350 250 S1650 215 1800 250 V320 H0Z" fill="#171914"/>
      <path d="M0 270 C150 235 300 305 450 270 S750 235 900 270 S1200 305 1350 270 S1650 235 1800 270" fill="none" stroke="#c2ff00" stroke-width="2" opacity=".6"/>
    </g>
    <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#3b4422" stroke-width="2"/>
    <text class="title" x="600" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" letter-spacing="14">BREAK LIMIT</text>
    <g clip-path="url(#title)"><rect y="60" width="140" height="90" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="150;1000" dur="3.5s" repeatCount="indefinite"/></rect></g>
    <text class="sub" x="600" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="12" fill="#9da391">TECHNOLOGY</text>
    <text class="tag" x="600" y="226" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="3" fill="#f5f3ed"><tspan class="tag2">Tecnología sin límites · USA ↔ RD</tspan></text>
  </g>
</svg>
